[project]
name = "unitty"
version = "0.0.3"
description = "Simplified unit conversions."
readme = "README.md"
authors = [
    { name = "Reuben Rusk", email = "pythoro@mindquip.com" }
]
keywords = ["unit", "units", "utility", "unit conversion"]
classifiers= [
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Natural Language :: English",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.3.2",
]

[project.urls]
Documentatio = "https://unitty.readthedocs.io/en/latest/"
Source = "https://github.com/pythoro/unitty.git"
Issues = "https://github.com/pythoro/unitty/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "ruff>=0.12.9",
]

[tool.ruff]
line-length = 79
output-format = "concise"

[tool.ruff.lint]
select = ["E", "F", "B", "C90", "I", "UP", "SIM", "D", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "D"]
